# Lokal development üçün Postgres.
# QEYD: host portu 5434 — host-un 5432/5433 portları başqa proseslə (SSH tunnel)
# məşğuldur. Konteyner daxilində standart 5432 qalır.
services:
  postgres:
    image: postgres:17-alpine
    container_name: aibaycan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aibaycan
    ports:
      - '5434:5432'
    volumes:
      - aibaycan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d aibaycan']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aibaycan_pgdata:
